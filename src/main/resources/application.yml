server:
  port: 8085

spring:
  application:
    name: sistema-aprobaciones-flowable
  datasource:
    url: jdbc:mysql://localhost:3306/sistema_aprobaciones
    username: root
    password: extremo2133
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    default-property-inclusion: non_null

flowable:
  database-schema-update: true
  async-executor-activate: false
  check-process-definitions: false

app:
  security:
    jwt:
      secret: ${IAM_JWT_SECRET:CHANGE_ME_DEV_SECRET_CHANGE_ME_DEV_SECRET_123456789}
      issuer: ${IAM_JWT_ISSUER:}
      audience: ${IAM_JWT_AUDIENCE:}
      default-role: ${IAM_DEFAULT_ROLE:ROLE_USER}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.rassini.aprobaciones: DEBUG
